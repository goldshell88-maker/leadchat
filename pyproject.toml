[project]
name = "leadchat-backend"
version = "0.1.0"
description = "LeadChat — Avito chat platform backend (sprint 2: realtime inbound)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "cryptography>=43",
    "arq>=0.26",
    "apscheduler>=3.10,<4",
    # XLSX-выгрузка статистики (06 §5.2): без пакета job падает в failed.
    "openpyxl>=3.1",
    # Sentry во всех трёх процессах (05 §7.1): без пакета init_sentry
    # логирует `sentry.sdk_missing` и телеметрии нет даже при заданном DSN.
    "sentry-sdk[fastapi]>=2",
    # Официальный SDK Claude (02 §3): вызовы идут только из воркера, импорт в
    # app/bots/ai.py ленивый — без пакета AI ведёт себя как «модель недоступна».
    "anthropic>=0.40",
    # Расшифровка голосовых СВОИМ Whisper — выбор владельца («давай свой
    # Whisper»): ни одна запись клиента не уходит в чужое облако.
    #
    # ⚠ ИМЕННО faster-whisper, А НЕ openai-whisper. Официальный пакет тянет
    # torch: 200+ МБ колёсами в каждый слой образа, а образ уезжает на сервер
    # через тоннель, который уже рвался на середине выкатки. faster-whisper —
    # это CTranslate2, его зависимости (ctranslate2, onnxruntime, av,
    # tokenizers, huggingface-hub) вместе меньше 150 МБ и torch не требуют.
    #
    # ⚠ ВЕСОВ МОДЕЛИ ЗДЕСЬ НЕТ И В ОБРАЗЕ НЕ БУДЕТ. Пакет качает их сам при
    # первом обращении в постоянный том (WHISPER_MODEL_DIR, см. compose):
    # полгигабайта в слое означали бы полгигабайта через тоннель на КАЖДОЙ
    # выкатке, а меняются они никогда.
    #
    # Импорт ленивый и живёт только в app/workers/transcribe.py: api и
    # планировщик не грузят ни CTranslate2, ни onnxruntime.
    "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
    "fakeredis>=2.24",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Шлюз (gateway/leadchat_gateway) — отдельный пакет, тесты гоняются этим же окружением.
pythonpath = [".", "gateway"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]
markers = [
    # 07 §6: набор ходит по сети в задеплоенный стенд. Без SMOKE_BASE_URL он
    # сам себя пропускает (tests/smoke/conftest.py), поэтому обычный прогон
    # `pytest tests/unit` в CI никуда не стучится.
    "smoke: регрессионный smoke против задеплоенного стенда (07 §6)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# only this backend's zone; fake_avito/ and frontend/ are owned elsewhere
extend-exclude = ["fake_avito", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # function call in argument defaults — FastAPI Depends()/typer.Option() idiom
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["app", "tests", "gateway"]

[[tool.mypy.overrides]]
# sentry_sdk: пакет типизирован, но импорт в app/core/observability.py и
# app/cli.py защищённый — mypy в урезанном окружении без него не должен краснеть.
# asyncpg: без py.typed; напрямую импортируется только нагрузочным
# инструментом tests/load/inject.py (в app драйвер живёт под SQLAlchemy).
module = [
    "fakeredis.*",
    "testcontainers.*",
    "apscheduler.*",
    "sentry_sdk.*",
    "asyncpg.*",
    # faster-whisper без py.typed; импортируется лениво и только внутри
    # app/workers/transcribe.py — в урезанном окружении без пакета
    # (тесты, локальный прогон) mypy не должен краснеть.
    "faster_whisper.*",
]
ignore_missing_imports = true

# arq пинит redis<6; в redis 5.x async-методы типизированы как
# `Awaitable[T] | T`, из-за чего каждый await в security.py даёт [misc].
# Код корректен (async-клиент всегда возвращает Awaitable) — глушим точечно.
[[tool.mypy.overrides]]
module = ["app.core.security"]
disable_error_code = ["misc"]
