# CI по docs/05-DEPLOY-OPS.md §5.1: backend (uv/ruff/mypy/alembic/pytest)
# + frontend (npm ci/eslint/tsc/vitest/build). Триггер: PR и push в main.
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadchat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/leadchat_test
      REDIS_URL: redis://localhost:6379/0
      TOKEN_ENC_KEY: ciOnlyKeyForTestRunsNeverUseInProduction000= # 32 байта в base64, как требует app/services/crypto.py
      JWT_SECRET: test-secret
      AVITO_API_BASE: http://localhost:9 # реальный Авито в тестах недостижим намеренно
      # обязательные поля Settings без дефолтов (08 §1.3) — иначе импорт приложения падает
      AVITO_CLIENT_ID: test-client-id
      AVITO_CLIENT_SECRET: test-client-secret
      MEDIA_SIGN_KEY: test-media-sign-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.5.x" }
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run alembic upgrade head # миграции применяются с нуля — это тоже тест
      - run: uv run pytest tests/unit -q

  integration:
    # testcontainers сам поднимает postgres; Docker есть на ubuntu-latest.
    #
    # Без демона весь набор skipif'ится (tests/integration/conftest.py), а
    # pytest на полностью пропущенном наборе возвращает 0 — зелёный CI, в
    # котором не выполнилось НИ ОДНОЙ проверки: ни гонки в очереди, ни
    # доставка, ни партиции. Тишина выглядит точно как успех, поэтому ниже
    # стоит явное требование к числу пройденных.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.5.x" }
      - run: uv sync --frozen
      # CI=true в GitHub Actions выставлен всегда. По нему conftest отличает
      # «у разработчика не запущен Docker — пропускаем» от «на сборке нет
      # Docker — это поломка сборки, а не повод молчать».
      - run: uv run pytest tests/integration -q

  # ==========================================================================
  # Десктоп: логика на Rust.
  #
  # ⚠ ЭТОГО JOB'А ЗДЕСЬ НЕ БЫЛО ВОВСЕ, И ЭТО ВЫШЛО БОКОМ. Восемьдесят восемь
  # тестов оболочки не гонялись ни здесь, ни в desktop-release.yml (там только
  # `tauri build`). Один из них — `reconnect_sends_updated_since_cursor` — был
  # привязан к календарной дате и покраснел сам собой, когда та прошла;
  # заметили это лишь при ручном прогоне 27.08, спустя недели.
  #
  # Windows-ветки на Linux не компилируются намеренно (они под
  # `#[cfg(target_os = "windows")]`), поэтому здесь проверяется общая логика:
  # кэш, очередь исходящих, синхронизация, разбор ссылок. Сборка инсталлятора
  # остаётся на windows-latest в desktop-release.yml.
  desktop:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      # Системные библиотеки Tauri 2 для Linux-сборки крейта.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint # eslint
      - run: npx tsc --noEmit
      - run: npm run test -- --run # vitest
      - run: npm run build # сборка тоже обязана проходить в CI
