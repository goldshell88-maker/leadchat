# Security-заголовки (DESIGN §9, 07 §4.5 N1).
# ВАЖНО про nginx: add_header в location ПОЛНОСТЬЮ заменяет набор из server —
# поэтому этот сниппет включается в каждый location, который добавляет свои
# заголовки (Cache-Control и т.п.). Не «на всякий случай», а обязательное условие.

# HSTS: 2 года; preload добавляем после месяца стабильной работы (05 §3.2)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Permissions-Policy: список того, чем приложение НЕ пользуется.
#
# ⚠ РАСШИРЕН 08.09. Было четыре возможности из двух десятков — «есть, но не
# критичные ограничения». Каждая строка ниже — заявление «этого мы не делаем»,
# и знакомое браузеру имя оно запирает даже для встроенного чужого кода.
#
# ⚠ НЕЗНАКОМОЕ ИМЯ БРАУЗЕР НЕ ПРОПУСКАЕТ МОЛЧА — ОН РУГАЕТСЯ В КОНСОЛЬ, И ЭТО
# СТОИЛО ЖАЛОБЫ ОТ ДИСПЕТЧЕРА В ТОТ ЖЕ ВЕЧЕР. Здесь стояло написанное мною
# «браузер молча пропускает незнакомые имена» — неправда: на `ambient-light-
# sensor` Chrome пишет «Error with Permissions-Policy header: Unrecognized
# feature» при КАЖДОЙ загрузке страницы, у каждого человека. Работе это не
# мешает, но красная строка в консоли выглядит поломкой, и разбираться с ней
# приходит смена.
#
# Имя снято. Список проверен настоящим Chromium — остальные двадцать одно он
# принимает молча; проверку стережёт `layout/раскладка.pw.ts` («политика
# возможностей не ругается в консоль»).
#
# ⚠ ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ, И ЭТО ВАЖНЕЕ СПИСКА:
#   * `clipboard-write` и `clipboard-read` — диспетчер копирует телефон клиента
#     одной кнопкой (`card-phone__copy`) и вставляет снимки из буфера в поле
#     ответа. Запрет сломал бы обе вещи ради нуля: буфер и так доступен только
#     своему коду;
#   * `fullscreen` — просмотрщик снимков; умолчание и так `self`;
#   * `autoplay` оставлен `self`: на нём звук нового обращения. Полный запрет
#     сделал бы смену глухой — ровно ту беду, из-за которой звук уже однажды
#     выключили (разбор 05.09).
add_header Permissions-Policy "accelerometer=(), autoplay=(self), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Наши ответы нельзя утащить в чужую страницу как ресурс (картинку, скрипт,
# шрифт). Для приложения, которое ничего не отдаёт наружу по построению, это
# бесплатно: встраивать нас никто и не должен.
add_header Cross-Origin-Resource-Policy same-origin always;
# Древние Flash/Acrobat-политики: домен их не отдаёт, но сказать «нет» дешевле,
# чем однажды обнаружить забытый crossdomain.xml.
add_header X-Permitted-Cross-Domain-Policies none always;

# ---------------------------------------------------------------------------
# Content-Security-Policy: вторая линия обороны клиентского кода.
#
# ⚠ ПРОСЬБА ВЛАДЕЛЬЦА 01.09: «максимально защитить код, который отображается на
# странице сайта в браузере».
#
# ЗАЧЕМ ИМЕННО ЗДЕСЬ. Текст сообщений пишет ПОСТОРОННИЙ ЧЕЛОВЕК из Авито. Сейчас
# от внедрения скрипта защищает ровно одно — экранирование React. Оно надёжно, но
# это ОДНА линия: первая же будущая правка, вставляющая разметку из сообщения,
# станет дырой без единого предупреждения. CSP делает вторую линию, которая
# держит даже тогда, когда первая пробита.
#
# ⚠ ПОЧЕМУ `script-src` БЕЗ 'unsafe-inline', НО С ХЕШЕМ. В `index.html` есть один
# встроенный скрипт. Он ставит до первой отрисовки три вещи, которых CSS знать не
# может: тему с пресетом (чтобы смена не видела вспышку светлого экрана), метку
# `data-lc-boot` (показывать ли каркас рабочего места — на входе и по
# приглашению его быть не должно) и ширину рельсы из сохранённого выбора.
# Не выполнится — интерфейс не сломается: откроется чужая тема и без каркаса,
# то есть ровно как до 07.09. Разрешить его через 'unsafe-inline' значило бы открыть
# заодно и любой чужой скрипт, то есть выключить главное, ради чего всё это.
# Поэтому он разрешён ПОИМЕННО, по хешу содержимого. Проверено: Vite отдаёт этот
# скрипт байт в байт как в исходнике, поэтому хеш стабилен от сборки к сборке.
# Хеш стережёт тест `CspInlineHash0109` — правка скрипта без правки хеша уронит
# ворота выкатки, а не сайт у людей.
#
# ⚠ ПОЧЕМУ `style-src` ВСЁ-ТАКИ С 'unsafe-inline'. Mantine и emotion вставляют
# стили в разметку. Строгая политика здесь уронила бы интерфейс целиком, а
# выигрыш был бы мал: чужой СТИЛЬ куда безобиднее чужого СКРИПТА. Убрать это
# можно только переводом emotion на nonce — отдельной задачей, не попутно.
#
# ⚠ ПОЧЕМУ НЕТ 'unsafe-eval'. Проверено по собранному бандлу: `new Function` не
# встречается ни разу. Значит запрет ничего не ломает и закрывает целый класс
# приёмов внедрения. С 07.09 у нас появился сервис-воркер (`public/sw.js`) —
# запись выше о том, что воркеров нет, устарела и снята. На довод это не влияет:
# воркер получает эту же политику своим ответом, и `eval` в нём тоже не нужен.
#
# ⚠ ПОЧЕМУ `worker-src` ВЫПИСАН ОТДЕЛЬНО, ХОТЯ СЕГОДНЯ РАБОТАЛО БЫ И БЕЗ НЕГО.
# По CSP 3 отсутствующий `worker-src` откатывается на `child-src`, затем на
# `script-src`, и только потом на `default-src`. У нас есть `script-src 'self'`,
# поэтому воркер того же происхождения разрешён уже им — проверять нечего.
# Опасность в другом: в этом же файле записан план перевести стили на nonce, а
# такая правка обычно уносит 'self' и из `script-src`. В тот день воркер перестал
# бы ставиться, а видно это было бы только в консоли у людей — уведомления просто
# лишились бы кнопок. Явная директива стоит копейки и ничего не ослабляет: 'self'
# уже самое узкое значение.
#
# `connect-src 'self'` покрывает и `wss://` того же источника (CSP 3). Написать
# здесь домен нельзя: envsubst обрабатывает только templates/, сниппеты
# копируются как есть, и `${DOMAIN}` уехал бы в браузер буквально.
#
# `frame-ancestors 'none'` дублирует X-Frame-Options выше намеренно: старый
# заголовок понимают все браузеры, новый умеет больше, и стоят они копейки.
#
# ⚠ ДВЕ ДИРЕКТИВЫ ДОБАВЛЕНЫ 08.09 ПО ПРОСЬБЕ ВЛАДЕЛЬЦА «запретить полностью
# внедрение в сайт и сторонние скрипты». Обе проверены по собранному бандлу,
# а не приняты на веру:
#
#   * `frame-src 'none'` — запрет встраивать в НАШУ страницу чужую. До сих пор
#     это разрешал `default-src 'self'`: рамка со своего же адреса прошла бы.
#     Проверено: `<iframe>` в исходниках не встречается ни разу, ломать нечего.
#     Обратное направление (нас в чужую страницу) закрыто `frame-ancestors`.
#
#   * `script-src-attr 'none'` — запрет обработчиков строкой в разметке
#     (`onclick="…"`). React вешает слушателей через `addEventListener`, а в
#     собранном бандле и в index.html строка `onclick=` не встречается ни разу.
#
# ⚠ ЧЕГО ДОБАВИТЬ НЕЛЬЗЯ, И ЭТО ПРОВЕРЕНО ТАМ ЖЕ. `require-trusted-types-for
# 'script'` — самый сильный из оставшихся заслонов, и в бою он был бы применим
# (100% Chromium). Но в собранном коде четыре прямых присвоения `innerHTML`;
# политика оборвала бы их без предупреждения, а увидеть это можно только на
# экране у человека. Это отдельная работа: сначала завести политику Trusted
# Types в сборке, потом включать заголовок.
#
# `style-src` с 'unsafe-inline' остаётся по причине, описанной выше: Mantine и
# emotion вставляют стили в разметку. Чужой СТИЛЬ безобиднее чужого СКРИПТА, а
# снять его можно только переводом emotion на nonce.
#
# ⚠ `img-src` И `media-src` ПУСКАЮТ ДОМЕНЫ АВИТО — ЭТО НЕ ПОСЛАБЛЕНИЕ, А ФАКТ О
# СИСТЕМЕ, И ОН СТОИЛ ТРЁХ ПОЛОМОК В БОЮ 01.09.
#
# Всё, что диспетчер видит и слышит от клиента, ЛЕЖИТ НЕ У НАС:
#
#   * фотографии сообщений — `services/media.py:attachment_out` отдаёт прямую
#     ссылку Авито, если файл не скачан к себе. Замер по базе: вложений 11 027,
#     скачанных к нам среди них НОЛЬ;
#   * аватары клиентов — `static.avito.ru` у 21 657 человек плюс шарды
#     `NN.img.avito.st`;
#   * голосовые — ручка `/messages/{id}/voice` спрашивает адрес у Авито на
#     лету, в базе его нет вовсе, и хост заранее не известен.
#
# Первая версия политики разрешала только `*.img.avito.st`, и это погасило
# сначала фотографии, потом аватары, потом звук — по одной поломке за раз.
# Поэтому здесь домены Авито целиком: угадывать точный хост в четвёртый раз
# дороже, чем разрешить картинки и звук с домена, откуда они и приходят.
#
# Безопасность от этого не страдает: `script-src` закрыт наглухо, а картинка и
# звук кода не несут. Расширены РОВНО две директивы, и обе — про содержимое, а
# не про исполнение.
#
# ⚠ ЧЕСТНАЯ ОГОВОРКА. Правильно было бы забирать это к себе и отдавать по
# подписанной ссылке, как уже сделано с загруженными вложениями: тогда Авито не
# видел бы, что и когда смотрят наши диспетчеры, ссылки не протухали бы вместе
# с чужим хранилищем, а политика вернулась бы к `'self'`. Это отдельная работа,
# а не строка в конфиге.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XzYMXExXAW2+ae/27Xxyoa0RPV9mI+bTU/p6gJIIlHI='; worker-src 'self'; frame-src 'none'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.avito.st https://*.avito.ru; media-src 'self' blob: https://*.avito.st https://*.avito.ru; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
