# Параметры проксирования обычных HTTP-запросов на upstream leadchat_api.
# keepalive к upstream требует HTTP/1.1 и ПУСТОГО заголовка Connection.
#
# ВНИМАНИЕ: таймауты (proxy_read_timeout / proxy_send_timeout) и
# proxy_next_upstream здесь НЕ задаются — они стоят на уровне server и
# переопределяются в отдельных location. Если продублировать их и тут,
# и в location, nginx падает с "directive is duplicate".
#
# Для WebSocket-локаций есть отдельный сниппет proxy-ws.conf: два
# proxy_set_header Connection в одном блоке отправили бы апстриму
# оба значения сразу и сломали upgrade.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# ВАЖНО: $remote_addr, а НЕ $proxy_add_x_forwarded_for. Второй ДОПИСЫВАЕТ
# реальный IP к значению, присланному клиентом, а uvicorn (--proxy-headers)
# берёт из цепочки САМЫЙ ЛЕВЫЙ адрес — то есть клиентский. Проверено на проде:
# запрос с `X-Forwarded-For: 203.0.113.77` записался в audit_log именно как
# 203.0.113.77. Последствия: обход счётчика брутфорса по IP (01 §1.7) и
# отравление журнала. Прокси у нас ровно один, доверять чужому XFF нечему —
# перезаписываем безусловно (07 §4.1 A6, §4.2 R6).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_connect_timeout 5s;
