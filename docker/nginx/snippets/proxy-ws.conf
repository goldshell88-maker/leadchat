# Проксирование WebSocket (01 §11): протокол апгрейдится, keepalive-заголовок
# не пустой, а взят из map $http_upgrade -> $connection_upgrade (nginx.conf).
#
# Таймаут 90 с: клиент шлёт прикладной ping каждые 25 с, сервер закрывает
# сокет после 60 с тишины (01 §11.5) — у nginx запас поверх обоих.

proxy_http_version 1.1;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# $remote_addr, а не $proxy_add_x_forwarded_for — см. пояснение в
# proxy-common.conf: клиентский X-Forwarded-For подделывается и выигрывает.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s;
proxy_read_timeout   90s;
proxy_send_timeout   90s;
