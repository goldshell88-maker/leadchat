# ============================================================================
# LeadChat — базовый nginx.conf (docs/05-DEPLOY-OPS.md §3.1).
# Виртуальный хост — /etc/nginx/conf.d/leadchat.conf, он генерируется из
# templates/leadchat.conf.template штатным entrypoint'ом образа nginx (envsubst).
# ============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- логи: JSON, чтобы складывались в общий пайплайн (05 §7.3) ---
    log_format json_combined escape=json
      '{"ts":"$time_iso8601","remote_addr":"$remote_addr",'
      '"method":"$request_method","uri":"$uri","status":$status,'
      '"bytes":$body_bytes_sent,"rt":$request_time,'
      '"upstream_rt":"$upstream_response_time","ua":"$http_user_agent",'
      '"req_id":"$upstream_http_x_request_id"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # версии/бэкенд наружу не светим
    proxy_hide_header  X-Powered-By;

    # --- сжатие статики ---
    # gzip_static: .gz-файлы предсобраны в образе (docker/Dockerfile.web) —
    # максимальное сжатие без затрат CPU в рантайме.
    gzip_static        on;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_types         text/plain text/css application/json application/javascript
                       text/javascript image/svg+xml application/wasm
                       application/manifest+json;
    gzip_min_length    1024;
    # brotli: официальный образ nginx:alpine модуль ngx_brotli НЕ содержит,
    # ставить его пакетом из Alpine нельзя (несовместимая сборка). Выигрыш
    # относительно gzip -9 на нашем бандле — единицы процентов, поэтому
    # сознательно живём на gzip_static. Если понадобится — собирать свой
    # образ nginx с --add-dynamic-module=ngx_brotli и добавить сюда
    # `brotli_static on;` (файлы .br генерировать рядом с .gz в Dockerfile.web).

    # --- кэш снимков клиентов с CDN Авито (location /api/v1/avito-img/) ---
    # Из офиса и из-за VPN снимок с NN.img.avito.st грузится 3–6 с, с сервера —
    # мгновенно (замер 12.09). Кэш на диске: неделя, до 2 ГБ, том imgcache в
    # compose — переживает пересоздание контейнера выкаткой.
    proxy_cache_path /var/cache/nginx/avito levels=1:2 keys_zone=avito_img:10m
                     max_size=2g inactive=7d use_temp_path=off;

    # --- зоны rate-limit (сами limit_req — в locations) ---
    # Логин. ВАЖНО: считать надо на ОФИС, а не на человека — вся команда
    # выходит в интернет с одного NAT-адреса. Прежние 10r/m рассчитывались на
    # одиночку; нагрузочный прогон (07 §3) показал, что при 30 операторах из
    # 919 попыток входа 756 отклонялись с 429, а ожидание доходило до 60 с.
    # Настоящая защита от перебора — прикладная (01 §1.7: 10 НЕУДАЧНЫХ попыток
    # на пару email+IP → 403 account_locked). Эта зона оставлена только как
    # страховка от явного флуда, поэтому лимит поднят до уровня рабочего офиса.
    limit_req_zone $binary_remote_addr zone=login:10m   rate=60r/m;
    # вебхуки: защита от флуда в публичный endpoint; лимит щедрый —
    # это не защита от Авито, а защита от сканеров/ботов
    limit_req_zone $binary_remote_addr zone=hooks:10m   rate=50r/s;
    # --- общий API: считаем на ЧЕЛОВЕКА, а не на адрес ---
    #
    # ⚠ Замер 06.09 (журнал nginx за 24 ч): 344–364 ответа 429, ВСЕ с одного
    # remote_addr — офисный NAT, 94,8 % трафика — и все с пустым upstream_rt,
    # то есть отбил сам nginx, до api они не дошли. Пачками: 07:00 UTC — 144,
    # 17:00 — 125, 03:00 — 26. По ручкам: counts 113, list 68, read 40,
    # messages 33, identity 23, merge-candidates 21, claim 17. 13 человек по
    # ≈2,6 r/s каждый: планка 30r/s на адрес упирается уже на 16–17
    # операторах, а залпы кадров при возврате во вкладку достают её сейчас.
    # react-query 429 не повторяет — человек видит «Не получилось загрузить»
    # и сорванное «Принять».
    #
    # Ключ — хвост access-токена. Токен — JWT HS256 в `Authorization: Bearer …`
    # (≈265 байт при sub=UUID, замер create_access_token 07.09); заголовок и
    # начало payload у всех одинаковые, уникальна подпись: HMAC-SHA256 =
    # 32 байта → base64url без паддинга = 43 символа (проверено jwt.encode:
    # ровно 43). Берём именно хвост, а не весь токен:
    # ключ короче — состояние в зоне меньше. Токен живёт 15 минут: после
    # обновления у человека новый ключ и чистый счётчик, старый вытесняется
    # из зоны как давно неиспользуемый. Без токена (login, refresh по cookie,
    # статика) ключ — адрес, как раньше; расширять regex до других схем
    # авторизации не нужно, их нет.
    #
    # ⚠ Ключ — кусок подписи, то есть секрет. В access_log он НЕ пишется и
    # формат лога выше менять нельзя. Сам nginx при срабатывании пишет в
    # error.log только имя зоны и адрес клиента («limiting requests … by zone
    # "api", client: …»), значение ключа — нет.
    map $http_authorization $lc_rl_key {
        default                                  $binary_remote_addr;
        "~^Bearer .+(?<lc_rl_sig>.{43})$"        $lc_rl_sig;
    }
    # Память: состояние с ключом в 43 байта занимает ~128 байт, документация
    # nginx обещает «about 8 thousand 128-byte states» на мегабайт — в 10m
    # около 80 тысяч ключей при наших единицах сотен в сутки (13 человек ×
    # 4 токена в час). Исчерпание зоны не роняет запросы: вытесняется
    # старое состояние.
    limit_req_zone $lc_rl_key          zone=api:10m      rate=30r/s;
    # Страховка по адресу. nginx подпись НЕ проверяет: залипший скрипт или
    # сканер, подставляющий в Bearer что попало, получает свежий ключ на
    # каждый запрос и мимо зоны api проходит целиком. Потолок высокий
    # намеренно: 200 r/s — это семь таких офисов, как наш (13 человек ≈ 35 r/s
    # в пике с залпами), сюда упирается только то, что и должно упираться.
    limit_req_zone $binary_remote_addr zone=api_addr:10m rate=200r/s;
    limit_req_status 429;

    # Ограничение одновременных соединений с одного IP (защита от slowloris).
    # Считается на ОФИС: у менеджера 1-2 WS плюс HTTP-соединения, десктоп рядом
    # с браузером удваивает. При 30 операторах за одним NAT прежние 64 давали
    # запас 1.07 — вторая вкладка у пары человек уже упирала в лимит.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # WebSocket: карта для заголовка Connection
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
