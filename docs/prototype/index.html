<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadChat by Lead Partner — прототип рабочего места</title>
<style>
/* ============ Токены Lead Partner ============ */
:root{
  --primary:#3cc13b;
  --primary-dark:#2ea32d;      /* только нетекстовое: hover-фоны, границы (10 §6.1) */
  --primary-ink:#0c2e0c;       /* текст/иконки НА зелёном 500/600 (10 §1.2) */
  --text-on-green:#1e7a1d;     /* зелёный ТЕКСТ на белом/green-50 (10 §1.2 green-700) */
  --primary-100:#bfe9be;
  --primary-200:#9ee09d;
  --primary-300:#8ada89;
  --primary-50:#d8f3d8;
  --focus:rgba(60,193,59,.25);
  --text:#212529;
  --text-2:#6c757d;
  --border:#dee2e6;
  --bg:#f8f9fa;
  --surface:#ffffff;
  --surface-2:#f8f9fa;
  --danger:#dc3545;
  --danger-bg:#f8d7da;
  --danger-text:#b02a37;
  --warning:#ffc107;
  --info:#0dcaf0;
  --info-bg:#cff4fc;
  --note-bg:#fff8dc;
  --note-border:#ffc107;
  --note-text:#7a6400;
  --bubble-in:#f1f3f5;
  --bubble-out:#d8f3d8;
  --bubble-bot:#eef9ee;
  --unread-bg:#1e7a1d;
  --unread-text:#ffffff;
  --shadow:0 1px 3px rgba(33,37,41,.08);
  --shadow-lg:0 8px 28px rgba(33,37,41,.16);
}
[data-theme="dark"]{
  --text:#e9ecef;
  --text-2:#adb5bd;
  --border:#2c3237;
  --bg:#121517;
  --surface:#191d21;
  --surface-2:#21262b;
  --danger-bg:#3d1418;
  --danger-text:#f1aeb5;
  --info-bg:#0b3947;
  --note-bg:#4d431a;
  --note-border:#ffca2c;
  --note-text:#ffe58f;
  --bubble-in:#21262b;
  --bubble-out:#1e3b1e;
  --bubble-bot:#172a17;
  --primary-50:#172a17;
  --text-on-green:#8ada89;     /* светлый акцент тёмной темы (10 §1.4) */
  --unread-bg:#3cc13b;
  --unread-text:#0c2e0c;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 8px 28px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Proxima Nova",Inter,Roboto,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:0;box-shadow:0 0 0 3px var(--focus);border-radius:6px;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh}

/* ============ Шапка ============ */
.topbar{
  display:flex;align-items:center;gap:14px;height:56px;flex:0 0 56px;
  padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:20;
}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{font-size:19px;color:var(--primary);letter-spacing:-.3px}
.logo b span{color:var(--text)}
.logo .by{font-size:13px;color:var(--text-2)}
.slogan{font-size:13px;color:var(--text-2);border-left:1px solid var(--border);padding-left:14px}
.topbar .spacer{flex:1}
.conn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--focus)}
.role-picker{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.role-picker select{
  padding:6px 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface-2);cursor:pointer;
}
.icon-btn{
  width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--border);background:var(--surface-2);
}
.icon-btn:hover{border-color:var(--primary-100)}
.me{display:flex;align-items:center;gap:8px}
.me .who{text-align:right;line-height:1.15}
.me .who b{font-size:13px}
.me .who span{display:block;font-size:13px;color:var(--text-2)}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--primary-ink);background:var(--primary);
}

.main{display:flex;flex:1;min-height:0}

/* ============ Рейл ============ */
.rail{
  width:64px;flex:0 0 64px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;
}
.rail-item{
  width:48px;padding:7px 0 5px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;gap:2px;color:var(--text-2);font-size:13px;
}
.rail-item .ic{font-size:19px}
.rail-item:hover{background:var(--surface-2)}
.rail-item.active{background:var(--primary-50);color:var(--text-on-green);font-weight:600}
.rail .push{flex:1}
.rail-lp{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:1px}

/* ============ Список диалогов ============ */
.list-pane{
  width:320px;flex:0 0 320px;display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-right:1px solid var(--border);
}
.list-head{padding:12px 14px 8px;display:flex;align-items:center;gap:8px}
.list-head h1{font-size:16px}
.badge-total{
  font-size:13px;font-weight:700;color:var(--unread-text);background:var(--unread-bg);
  border-radius:10px;padding:1px 7px;min-width:20px;text-align:center;
}
.search-wrap{padding:0 14px 10px;position:relative}
.search-wrap .lens{position:absolute;left:24px;top:8px;font-size:13px;color:var(--text-2)}
#search{
  width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface-2);
}
#search::placeholder{color:var(--text-2)}
.tabs{display:flex;gap:2px;padding:0 14px 10px}
.tabs.searching .tab{opacity:.45}
.tab{
  flex:1;padding:6px 2px;font-size:14px;color:var(--text-2);border-radius:8px;text-align:center;
}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--primary-50);color:var(--text-on-green);font-weight:600}
.tab .cnt{font-size:13px;opacity:.8}
.search-info{
  padding:6px 14px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--border);
}
.search-info button{color:var(--text-on-green);font-weight:600}
.dialog-list{flex:1;overflow-y:auto;min-height:0}
.row{
  display:flex;gap:10px;padding:10px 14px;cursor:pointer;border-left:3px solid transparent;
}
.row:hover{background:var(--surface-2)}
.row.active{background:var(--primary-50);border-left-color:var(--primary)}
.row .col{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:5px}
.row .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .flag{font-size:13px;color:var(--text-on-green)}
.row .time{margin-left:auto;font-size:13px;color:var(--text-2);flex:0 0 auto}
.row .item{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .l3{display:flex;align-items:center;gap:6px;margin-top:2px}
.row .prev{flex:1;min-width:0;font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .prev{color:var(--text);font-weight:500}
.unread-badge{
  flex:0 0 auto;min-width:20px;height:20px;border-radius:10px;background:var(--unread-bg);color:var(--unread-text);
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;
}
.chip{
  display:inline-block;font-size:13px;font-weight:600;border-radius:6px;padding:1px 8px;flex:0 0 auto;
}
.chip-danger{background:var(--danger-bg);color:var(--danger-text)}
.chip-info{background:var(--info-bg);color:#055160}
[data-theme="dark"] .chip-info{color:#9eeaf9}
.chip-green{background:var(--primary-50);color:var(--text-on-green)}
.empty-list{padding:32px 20px;text-align:center;color:var(--text-2);font-size:13px}
.my-stats{
  border-top:1px solid var(--border);padding:9px 14px;font-size:13px;color:var(--text-2);
  background:var(--surface-2);
}
.my-stats b{color:var(--text-on-green)}

/* ============ Центр: переписка ============ */
.thread-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.thread-head{
  display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.thread-head .title{font-weight:700;font-size:15px}
.thread-head .sub{font-size:13px;color:var(--text-2)}
.pill{
  font-size:13px;font-weight:600;border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px;
}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.st-new{background:var(--info-bg);color:#055160}
[data-theme="dark"] .pill.st-new{color:#9eeaf9}
.pill.st-in_progress{background:var(--primary-50);color:var(--text-on-green)}
.pill.st-closed{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.pill-select{
  font-size:13px;font-weight:600;border-radius:20px;padding:3px 8px;cursor:pointer;
  border:1px solid transparent;
}
.pill-select.st-new{background:var(--info-bg);color:#055160}
[data-theme="dark"] .pill-select.st-new{color:#9eeaf9}
.pill-select.st-in_progress{background:var(--primary-50);color:var(--text-on-green)}
.pill-select.st-closed{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.pill-select:hover{border-color:var(--border)}
#card-toggle{display:none}
.acc-chip{
  font-size:13px;color:var(--text-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;
  background:var(--surface-2);
}
.msgs{flex:1;overflow-y:auto;min-height:0;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.sep{align-self:center;font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:2px 12px;margin:4px 0}
.sysline{align-self:center;text-align:center;font-size:13px;color:var(--text-2);max-width:72%}
.bubble{max-width:68%;border-radius:14px;padding:8px 12px 6px;box-shadow:var(--shadow);position:relative;
  font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.bubble .meta{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--text-2);margin-top:3px}
.b-in{align-self:flex-start;background:var(--bubble-in);border:1px solid var(--border);border-bottom-left-radius:4px}
.b-out,.b-bot{align-self:flex-end;background:var(--bubble-out);border:1px solid var(--primary-50);border-bottom-right-radius:4px}
[data-theme="dark"] .b-out,[data-theme="dark"] .b-bot{border-color:#2c522e}
.b-bot{background:var(--bubble-bot);border:1px dashed var(--primary-200)}
.sender{font-size:13px;font-weight:700;margin-bottom:2px}
.b-in .sender{color:var(--text-on-green)}
.b-out .sender{color:var(--text-on-green)}
.b-bot .sender{color:var(--text-on-green)}
.tick-ok{color:var(--text-on-green)}
.tick-wait{color:var(--text-2)}
.tick-fail{color:var(--danger)}
.b-note{
  align-self:stretch;max-width:none;background:var(--note-bg);border:1px solid var(--note-border);
  border-radius:10px;padding:8px 12px;font-size:14px;color:var(--note-text);box-shadow:none;
}
.b-note .n-head{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;opacity:.85}
.new-msgs-btn{
  position:absolute;left:50%;transform:translateX(-50%);bottom:130px;z-index:5;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;color:var(--text-on-green);padding:6px 14px;
}

/* ============ Низ центра: composer / плашки ============ */
.thread-foot{background:var(--surface);border-top:1px solid var(--border);padding:10px 16px 12px;position:relative}
.readonly-banner{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px dashed var(--border);
  border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text-2);
}
.readonly-banner .ttl{font-weight:700;color:var(--text)}
.readonly-banner .grow{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;
  font-weight:600;border:1px solid var(--border);background:var(--surface);
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-sm{padding:5px 10px;font-size:13px}
.composer .mode-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:4px 12px;font-size:13px;color:var(--text-2)}
.seg button.active{background:var(--primary-50);color:var(--text-on-green);font-weight:700}
.seg button.active.note{background:var(--note-bg);color:var(--note-text)}
.tool-btn{
  padding:4px 9px;font-size:13px;border:1px solid var(--border);border-radius:8px;color:var(--text-2);
  background:var(--surface-2);
}
.tool-btn:hover{border-color:var(--primary-300);color:var(--text)}
.hint-slash{font-size:13px;color:var(--text-2);margin-left:auto}
.hint-slash kbd{
  border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;
  font-family:inherit;font-size:13px;background:var(--surface-2);
}
.input-row{display:flex;gap:10px;align-items:flex-end}
#composer-input{
  flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:9px 12px;
  min-height:40px;max-height:120px;background:var(--surface);line-height:1.4;
}
#composer-input::placeholder{color:var(--text-2)}
.composer.note-mode #composer-input{background:var(--note-bg);border-color:var(--note-border);color:var(--note-text)}
.send-btn{
  width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.send-btn:hover{background:var(--primary-dark)}
.composer.note-mode .send-btn{background:var(--warning);color:#5c4a00}

/* попап шаблонов */
.tpl-pop{
  position:absolute;bottom:calc(100% + 6px);left:16px;width:340px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;overflow:hidden;
}
.tpl-pop .tp-head{padding:9px 14px;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--text-2);border-bottom:1px solid var(--border)}
.tpl{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid var(--border)}
.tpl:last-child{border-bottom:0}
.tpl:hover,.tpl.active{background:var(--primary-50)}
.tpl b{display:block;font-size:14px}
.tpl span{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-empty{padding:12px 14px;font-size:13px;color:var(--text-2)}

/* ============ Правая карточка ============ */
.card-pane{
  width:296px;flex:0 0 296px;overflow-y:auto;background:var(--surface);
  border-left:1px solid var(--border);padding:16px 16px 56px;
}
.sec{margin-bottom:18px}
.sec h3{
  font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-2);margin-bottom:8px;
  padding-bottom:5px;border-bottom:1px solid var(--border);
}
.client-top{display:flex;gap:10px;align-items:center}
.client-top .avatar{width:42px;height:42px;font-size:14px}
.client-top .cn{font-weight:700;font-size:14px}
.client-top .cr{font-size:13px;color:var(--text-2)}
.star{color:var(--warning)}
.kv{display:flex;gap:8px;font-size:13px;margin-top:7px}
.kv .k{color:var(--text-2);flex:0 0 auto}
.kv .v{font-weight:500}
.kv .v small{display:block;font-weight:400;color:var(--text-2);font-size:13px}
.item-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.item-card .it{font-size:14px;font-weight:600;line-height:1.3}
.item-card .pr{color:var(--text-on-green);font-weight:700;font-size:14px;margin-top:3px}
.item-card .ph{
  margin-top:8px;height:64px;border-radius:8px;background:linear-gradient(135deg,var(--primary-50),var(--surface));
  border:1px dashed var(--primary-200);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--text-2);
}
.item-card a{display:inline-block;margin-top:7px;font-size:13px;color:var(--text-on-green);text-decoration:none;font-weight:600}
.item-card a:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px}
.ctrl-row .k{color:var(--text-2);flex:0 0 76px}
.ctrl-row select{
  flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;
}
.notes-list .note-item{
  background:var(--note-bg);border:1px solid var(--note-border);color:var(--note-text);
  border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.4;margin-bottom:7px;
}
.notes-list .note-item small{display:block;margin-top:3px;font-size:13px;opacity:.75}
.hist{font-size:13px;color:var(--text-2);line-height:1.5}
.thread-pane .placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-2)}

/* ============ Модалка, тост, бейдж прототипа ============ */
.overlay{
  position:fixed;inset:0;background:rgba(33,37,41,.45);display:flex;align-items:center;justify-content:center;
  z-index:50;
}
.modal{width:400px;max-width:92vw;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:20px}
.modal h2{font-size:16px;margin-bottom:4px}
.modal .msub{font-size:13px;color:var(--text-2);margin-bottom:14px}
.staff-opt{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;cursor:pointer;
}
.staff-opt:hover{border-color:var(--primary-300)}
.staff-opt input{accent-color:var(--primary)}
.staff-opt .so-n{font-weight:600;font-size:13px}
.staff-opt .so-r{font-size:13px;color:var(--text-2)}
.staff-opt .on{margin-left:auto;font-size:13px;color:var(--text-on-green)}
.modal textarea{
  width:100%;resize:none;border:1px solid var(--border);border-radius:10px;padding:8px 10px;
  background:var(--surface);min-height:56px;margin-top:4px;
}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{
  position:fixed;right:16px;bottom:52px;transform:translateY(8px);z-index:60;
  background:var(--text);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:10px;
  box-shadow:var(--shadow-lg);opacity:0;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
.proto-badge{
  position:fixed;right:12px;bottom:10px;z-index:40;pointer-events:none;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  font-size:13px;color:var(--text-2);padding:5px 12px;display:flex;gap:6px;align-items:center;
}
.proto-badge b{color:var(--text-on-green)}

@media (max-width:1180px){.card-pane{width:260px;flex-basis:260px}.slogan{display:none}}
@media (max-width:1020px){
  .card-pane{display:none}
  #card-toggle{display:inline-flex}
  .card-pane.overlay-open{
    display:block;position:fixed;top:56px;right:0;bottom:0;width:300px;z-index:45;
    box-shadow:var(--shadow-lg);
  }

    const staff = STAFF.find(s => s.id === picked);
    const comment = $('#tr-comment').value.trim();
    d.assignee = picked;
    d.transferredTo = picked;   // ⚑ увидит только получатель (01 §5.1 transferred_to_me)
    d.msgs.push({ t:'sys', text:'⚑ Диалог передан: ' + ME.short + ' → ' + staff.name +
      (comment ? ' · «' + comment + '»' : ''), time: nowTime() });
    closeModal();
    toast('Диалог передан: ' + staff.name);
    renderAll();
  });
}

/* =================== Рендер: список =================== */
function tabItems(tab) {
  return DIALOGS.filter(d => {
    if (tab === 'mine')   return d.assignee === 'me' && d.status !== 'closed';
    if (tab === 'all')    return d.status !== 'closed';
    if (tab === 'new')    return d.status === 'new';
    return d.status === 'closed';
  });
}
/* какие типы сообщений матчит поиск: текст переписки, для ролей с правом — и заметки;
   разделители дат и системные строки не ищутся (11 §8.4; заметки observer'у не отдаются — 01 §6.1) */
const searchableMsg = m =>
  m.t === 'in' || m.t === 'out' || m.t === 'bot' || (m.t === 'note' && can.notes());
function filteredDialogs() {
  const q = state.search.trim().toLowerCase();
  let items;
  if (q) {
    /* поиск идёт по ВСЕМ диалогам, независимо от вкладки (11 §8.4) */
    items = DIALOGS.filter(d =>
      d.name.toLowerCase().includes(q) ||
      d.item.toLowerCase().includes(q) ||
      (d.client.phone || '').replace(/[\s-]/g, '').includes(q.replace(/[\s-]/g, '')) ||
      d.msgs.some(m => searchableMsg(m) && (m.text || '').toLowerCase().includes(q)));
  } else {
    items = tabItems(state.tab);
  }
  return items.slice().sort((a, b) => {
    /* сначала непрочитанные (негатив первым только внутри них), затем по времени — 11 §2.1 */
    const score = d => (d.unread > 0 ? 2 : 0) + (d.unread > 0 && d.negative ? 1 : 0);
    return score(b) - score(a) || b.ord - a.ord;
  });
}
function renderTabs() {
  const searching = !!state.search.trim();
  $('#tabs').classList.toggle('searching', searching);
  $('#tabs').innerHTML = TABS.map(t => {
    /* счётчики — только «Мои»/«Новые», и это диалоги С НЕПРОЧИТАННЫМИ (11 §2.1) */
    const withCnt = t.id === 'mine' || t.id === 'new';
    const n = withCnt ? tabItems(t.id).filter(d => d.unread > 0).length : 0;
    return '<button class="tab' + (state.tab === t.id ? ' active' : '') + '" role="tab"' +
      ' aria-selected="' + (state.tab === t.id) + '"' +
      ' tabindex="' + (state.tab === t.id ? '0' : '-1') + '" data-tab="' + t.id + '">' +
      t.label + (withCnt && n ? ' <span class="cnt">' + n + '</span>' : '') + '</button>';
  }).join('');
}
function renderList() {
  renderTabs();
  const items = filteredDialogs();
  const listEl = $('#dialog-list');
  const q = state.search.trim();
  /* счётчик результатов поиска + сброс (11 §2.1, §8.4) */
  let html = q ?
    '<div class="search-info">Найдено: ' + items.length + ' · <button id="search-reset">Сбросить ✕</button></div>' : '';
  if (!items.length) {
    html += '<div class="empty-list">Ничего не найдено.<br>Измените фильтр или запрос.</div>';
  } else {
    const hasActive = items.some(d => d.id === state.currentId);
    html += items.map((d, i) => {
      const idx = DIALOGS.indexOf(d);
      const av = AVA_COLORS[idx % AVA_COLORS.length];
      const lm = lastVisible(d);
      let prev = lm ? lm.text : '';
      if (lm && lm.t === 'out') prev = 'Вы: ' + prev;
      if (lm && lm.t === 'bot') prev = '🤖 ' + prev;
      const initials = d.name.split(' ').map(w => w[0]).join('').slice(0, 2);
      /* roving tabindex: одна tab-остановка на весь список (10 §5.2, §6.3) */
      const tabStop = d.id === state.currentId || (!hasActive && i === 0) ? '0' : '-1';
      return '<div class="row' + (d.id === state.currentId ? ' active' : '') + (d.unread ? ' unread' : '') +
        '" data-id="' + d.id + '" tabindex="' + tabStop + '" role="option"' +
        ' aria-selected="' + (d.id === state.currentId) + '">' +
        '<span class="avatar" style="background:' + av.bg + ';color:' + av.ink + '">' + esc(initials) + '</span>' +
        '<div class="col">' +
          '<div class="l1">' +
            (d.transferredTo === 'me' ? '<span class="flag" title="Передан вам коллегой">⚑</span>' : '') +
            (d.bot ? '<span class="flag" title="Диалог ведёт бот">🤖</span>' : '') +
            '<span class="name">' + esc(d.name) + '</span>' +
            '<span class="time">' + esc(d.time) + '</span>' +
          '</div>' +
          '<div class="item">' + esc(d.item) + '</div>' +
          '<div class="l3">' +
            (d.negative ? '<span class="chip chip-danger">негатив</span>' : '') +
            '<span class="prev">' + esc(prev) + '</span>' +
            (d.unread ? '<span class="unread-badge">' + d.unread + '</span>' :
              (lm && lm.t === 'out' ? '<span class="tick-ok" title="Отвечено">✓</span>' : '')) +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  listEl.innerHTML = html;
  const sr = $('#search-reset');
  if (sr) sr.addEventListener('click', () => {
    state.search = '';
    $('#search').value = '';
    renderList();
  });
  const total = DIALOGS.reduce((s, d) => s + d.unread, 0);
  $('#total-unread').textContent = total;
  $('#total-unread').style.display = total ? '' : 'none';
  document.title = (total ? '(' + total + ') ' : '') + 'LeadChat by Lead Partner — прототип';
}

/* =================== Рендер: переписка =================== */
function renderThreadHead() {
  const d = byId(state.currentId);
  const el = $('#thread-head');
  if (!d) { el.innerHTML = ''; return; }

  const statusCtl = can.manage() ?
    '<select class="pill-select st-' + d.status + '" id="head-status-select" aria-label="Статус диалога">' +
      Object.keys(STATUS_TITLES).map(s =>

function bubbleHtml(m) {
  if (m.t === 'sep') return '<div class="sep">' + esc(m.text) + '</div>';
  if (m.t === 'sys') return '<div class="sysline">' + esc(m.text) + (m.time ? ' · ' + esc(m.time) : '') + '</div>';
  if (m.t === 'note') {
    if (!can.notes()) return '';
    return '<div class="b-note"><div class="n-head">🗒 Заметка · видно только сотрудникам</div>' +
      esc(m.text) + '<div class="meta">' + esc(m.who || '') + ' · ' + esc(m.time || '') + '</div></div>';
  }
  if (m.t === 'in') {
    return '<div class="bubble b-in">' + esc(m.text) +
      '<div class="meta">' + esc(m.time || '') + '</div></div>';
  }
  const tick = m.st === 'pending' ? '<span class="tick-wait" title="Отправляется">⏳</span>' :
               m.st === 'fail'    ? '<span class="tick-fail" title="Ошибка">✗</span>' :
                                    '<span class="tick-ok" title="Доставлено">✓</span>';
  const sender = m.t === 'bot' ? '🤖 Бот LeadChat' : (m.who || '');
  return '<div class="bubble ' + (m.t === 'bot' ? 'b-bot' : 'b-out') + '">' +
    (sender ? '<div class="sender">' + esc(sender) + '</div>' : '') +
    esc(m.text) +
    '<div class="meta">' + esc(m.time || '') + (m.t === 'out' ? ' ' + tick : '') + '</div></div>';
}
/* автоскролл только когда читатель у низа ленты; иначе — кнопка «↓ новые» (11 §2.2) */
let msgsMeta = { id: null, count: 0 };
function renderMsgs(forceScroll) {
  const d = byId(state.currentId);
  const el = $('#msgs');
  const btn = $('#new-msgs-btn');
  if (!d) {
    el.innerHTML = '<div class="placeholder">Выберите диалог слева</div>';
    msgsMeta = { id: null, count: 0 };
    btn.hidden = true;
    return;
  }
  const sameDialog = msgsMeta.id === d.id;
  const grew = sameDialog && d.msgs.length > msgsMeta.count;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  const keepPosition = sameDialog && !nearBottom && !forceScroll;
  const prevScroll = el.scrollTop;
  el.innerHTML = d.msgs.map(bubbleHtml).join('');
  msgsMeta = { id: d.id, count: d.msgs.length };
  if (keepPosition) {
    el.scrollTop = prevScroll;                 // читатель выше — позицию не дёргаем
    if (grew) btn.hidden = false;              // пришло новое — предлагаем спуститься
  } else {
    el.scrollTop = el.scrollHeight;
    btn.hidden = true;
  }
}

/* =================== Рендер: низ (composer / плашки) =================== */
function composerHtml(noteOnly) {

function renderFoot() {
  const el = $('#thread-foot');
  const d = byId(state.currentId);
  if (!d) { el.innerHTML = ''; return; }
  if (state.role === 'observer') {
    /* у observer композера нет совсем — ни поля, ни плашки (11 §2.5.3, 03 §5.3) */
    el.innerHTML = '';
    return;
  }
  if (d.status === 'closed') {
    /* в закрытый диалог не пишут: плашка вместо композера (11 §2.3, 422 conversation_closed) */
    el.innerHTML =
      '<div class="readonly-banner">' +
        '<span>🔒</span><span><span class="ttl">Диалог закрыт.</span> Чтобы ответить — верните его в работу</span>' +
        '<span class="grow"></span>' +
        '<button class="btn btn-sm btn-primary" id="reopen-btn">Вернуть в работу</button>' +
      '</div>';
    $('#reopen-btn').addEventListener('click', () => {
      const dd = byId(state.currentId);
      if (can.send()) dd.assignee = 'me';   // назначается на меня (11 §2.3)
      setStatus('in_progress');
    });
    return;
  }
  if (can.send()) {
    el.innerHTML = composerHtml(false);
    bindComposer(false);
  } else { /* head */
    el.innerHTML =
      '<div class="readonly-banner" style="margin-bottom:8px">' +
        '<span>👁</span><span><span class="ttl">Режим просмотра</span> — назначьте менеджера или передайте диалог</span>' +
        '<span class="grow"></span>' +
        '<button class="btn btn-sm btn-primary" id="reassign-btn">Переназначить</button>' +
      '</div>' +
      composerHtml(true);
    $('#reassign-btn').addEventListener('click', () => openTransferModal('Переназначить менеджера'));
    bindComposer(true);
  }
}

/* =================== Действия =================== */
function setStatus(next) {
  const d = byId(state.currentId);
  if (!d || d.status === next) return;
  const prev = STATUS_TITLES[d.status];
  d.status = next;
  d.msgs.push({ t:'sys', text:'Статус изменён: ' + prev + ' → ' + STATUS_TITLES[next], time: nowTime() });
  toast('Статус: ' + STATUS_TITLES[next]);
  renderAll();
}

function selectDialog(id, focusComposer) {
  state.currentId = id;
  state.noteMode = false;               // режим заметки не «переезжает» в другой диалог (11 §2.3)
  const d = byId(id);
  if (d) {
    if (d.unread) d.unread = 0;         // прочитано при открытии
    if (d.transferredTo === 'me') d.transferredTo = null;  // ⚑ гаснет после открытия (11 §2.1)
  }
  hideTplPop();
  renderAll();
  if (focusComposer) {                  // открыл из списка — фокус сразу в textarea (10 §5.2)
    const inp = $('#composer-input');
    if (inp) inp.focus();
  }
}
/* J/K и ↓/↑ — навигация по списку с клавиатуры (10 §5.1) */
function moveSelection(delta) {
  const items = filteredDialogs();
  if (!items.length) return;
  const i = items.findIndex(d => d.id === state.currentId);
  const ni = i < 0 ? (delta > 0 ? 0 : items.length - 1)
                   : Math.min(items.length - 1, Math.max(0, i + delta));
  if (items[ni] && items[ni].id !== state.currentId) selectDialog(items[ni].id, false);
}

function sendCurrent() {
  const input = $('#composer-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const d = byId(state.currentId);
  if (!d) return;
  const noteOnly = state.role === 'head';

  if (state.noteMode || noteOnly) {
    d.msgs.push({ t:'note', text, time: nowTime(), who: ME.short });
    d.notes.push({ text, when: nowTime() + ', ' + ME.short });
    input.value = '';
    state.drafts[d.id] = '';
    toast('Заметка сохранена — клиент её не увидит');
    renderMsgs(true); renderCard(); renderList();
    $('#composer-input').focus();
    return;
  }

  const msg = { t:'out', text, time: nowTime(), who: ME.short, st:'pending' };
  d.msgs.push(msg);
  /* «кто первым ответил — тот и ведёт» (DESIGN, ONBOARDING §3.1):
     ответ в ничей новый диалог берёт его в работу */
  let tookOver = false;
  if (d.status === 'new') {
    d.status = 'in_progress';
    d.assignee = 'me';
    d.msgs.push({ t:'sys', text: ME.short + ' взяла диалог в работу', time: nowTime() });
    tookOver = true;
  }
  input.value = '';
  state.drafts[d.id] = '';
  if (tookOver) {
    renderAll();                // статус-пилюля, карточка и вкладки обновятся; диалог переедет в «Мои»
    toast('Диалог ваш — «кто первым ответил, тот и ведёт»');
  } else {
    renderMsgs(true); renderList();
  }
  const inp = $('#composer-input');
  if (inp) inp.focus();

  setTimeout(() => {            // доставка ⏳ → ✓
    msg.st = 'ok';
    renderMsgs(); renderList();
  }, 900);

  const dialogId = d.id;
  setTimeout(() => {            // демо: автоответ клиента
    const dd = byId(dialogId);
    const reopened = dd.status === 'closed';
    if (reopened) {             // клиент написал в закрытый — диалог вернулся в «Новые» (FAQ-3)
      dd.status = 'new';
      dd.msgs.push({ t:'sys', text:'↩ Клиент вернулся — диалог переоткрыт', time: nowTime() });
    }
    dd.msgs.push({ t:'in', text: AUTO_REPLIES[state.replyIdx++ % AUTO_REPLIES.length], time: nowTime() });
    dd.time = nowTime();
    if (state.currentId === dialogId) {
      renderMsgs();
      if (reopened) { renderThreadHead(); renderFoot(); renderCard(); }
    } else {
      dd.unread += 1;
    }
    renderList();
  }, 2000);
}

/* =================== Шаблоны («/» и ⚡) =================== */
function substitute(body) {
  const d = byId(state.currentId);
  return body
    .replace(/\{имя\}/g, d ? firstName(d.name) : '')
    .replace(/\{менеджер\}/g, ME.short);
}
/* попап управляется и клавиатурой: ↑↓ — выбор, Enter — вставка, набор текста — фильтр (11 §3.1) */
const tplState = { idx: 0 };
function tplFiltered() {
  const inp = $('#composer-input');
  const q = (inp ? inp.value : '').trim().toLowerCase();
  return TEMPLATES.map((t, i) => ({ t, i })).filter(x =>
    !q || x.t.title.toLowerCase().includes(q) || x.t.body.toLowerCase().includes(q));
}
function insertTpl(i) {
  const input = $('#composer-input');
  input.value = substitute(TEMPLATES[i].body);
  state.drafts[state.currentId] = input.value;
  hideTplPop();
  input.focus();
}
function showTplPop() {
  hideTplPop();
  const foot = $('#thread-foot');
  const list = tplFiltered();
  if (tplState.idx > list.length - 1) tplState.idx = Math.max(0, list.length - 1);
  const pop = document.createElement('div');
  pop.className = 'tpl-pop';
  pop.id = 'tpl-pop';
  pop.innerHTML = '<div class="tp-head">⚡ Быстрые ответы · ↑↓ — выбрать · Enter — вставить · набор — фильтр</div>' +
    (list.length ?
      list.map((x, li) =>
        '<button class="tpl' + (li === tplState.idx ? ' active' : '') + '" data-tpl="' + x.i + '"><b>' + esc(x.t.title) + '</b><span>' +
        esc(substitute(x.t.body)) + '</span></button>').join('') :
      '<div class="tpl-empty">Ничего не найдено — Esc, чтобы закрыть</div>');
  foot.appendChild(pop);
  pop.addEventListener('click', e => {
    const btn = e.target.closest('[data-tpl]');
    if (!btn) return;
    insertTpl(+btn.dataset.tpl);
  });
}
function hideTplPop() {
  const p = $('#tpl-pop');
  if (p) p.remove();
}

/* =================== Привязка composer =================== */
function bindComposer(noteOnly) {
  const input = $('#composer-input');
  const send = $('#send-btn');
  if (!input) return;
  /* черновик диалога восстанавливается после любого перерендера (11 §2.3) */
  input.value = state.drafts[state.currentId] || '';
  send.addEventListener('click', sendCurrent);
  input.addEventListener('keydown', e => {
    const pop = $('#tpl-pop');
    if (pop) {                       // клавиатура попапа шаблонов (11 §3.1)
      const list = tplFiltered();
      if (e.key === 'ArrowDown') { e.preventDefault(); tplState.idx = Math.min(list.length - 1, tplState.idx + 1); showTplPop(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); tplState.idx = Math.max(0, tplState.idx - 1); showTplPop(); return; }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (list[tplState.idx]) insertTpl(list[tplState.idx].i);
        return;
      }
      if (e.key === 'Escape') { e.stopPropagation(); hideTplPop(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCurrent(); }
  });
  input.addEventListener('input', () => {
    if (!noteOnly && !state.noteMode && input.value === '/' && !$('#tpl-pop')) {
      input.value = '';
      tplState.idx = 0;
      showTplPop();
    } else if ($('#tpl-pop')) {
      tplState.idx = 0;
      showTplPop();                  // набор после «/» фильтрует список на лету
    }
    state.drafts[state.currentId] = input.value;
  });
  if (!noteOnly) {
    const mMsg = $('#mode-msg'), mNote = $('#mode-note');
    if (mMsg) mMsg.addEventListener('click', () => { state.noteMode = false; renderFoot(); $('#composer-input').focus(); });
    if (mNote) mNote.addEventListener('click', () => { state.noteMode = true; hideTplPop(); renderFoot(); $('#composer-input').focus(); });
    const tplBtn = $('#tpl-btn');
    if (tplBtn) tplBtn.addEventListener('click', () => {
      if ($('#tpl-pop')) hideTplPop(); else { tplState.idx = 0; showTplPop(); }
    });
    const att = $('#attach-btn');
    if (att) att.addEventListener('click', () => toast('Вложения — вне рамок этого прототипа'));
  }
}

/* =================== Роль и тема =================== */
function applyRole() {
  $('#me-role').textContent = ROLE_TITLES[state.role];
  $('#nav-stats').style.display = can.statsAll() ? '' : 'none';
  $('#nav-settings').style.display = can.settings() ? '' : 'none';
  const ms = $('#my-stats');
  if (state.role === 'manager') {
    ms.style.display = '';
    ms.innerHTML = 'Моя статистика за сегодня: <b>14 диалогов</b> · ср. ответ <b>1 м 40 с</b>';
  } else if (state.role === 'admin') {   // подвал админа — счётчик (11 §2.5.4)
    ms.style.display = '';
    ms.innerHTML = 'Всего диалогов: <b>' + DIALOGS.length + '</b>';
  } else {
    ms.style.display = 'none';
  }
  if (!can.send()) state.noteMode = false;
}
function renderAll() {
  applyRole();
  renderList();
  renderThreadHead();
  renderMsgs();
  renderFoot();
  renderCard();
}

/* =================== Глобальные обработчики =================== */
$('#dialog-list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) selectDialog(row.dataset.id, true);   // открытие из списка → фокус в композер (10 §5.2)
});
$('#dialog-list').addEventListener('keydown', e => {
  const row = e.target.closest('.row');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectDialog(row.dataset.id, true); }
});
$('#tabs').addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderList(); }
});
$('#tabs').addEventListener('keydown', e => {   // стрелки по вкладкам (10 §6.3)
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault();
  const i = TABS.findIndex(t => t.id === state.tab);
  const ni = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
  state.tab = TABS[ni].id;
  renderList();
  const btn = $('#tabs [data-tab="' + state.tab + '"]');
  if (btn) btn.focus();
});
$('#search').addEventListener('input', e => { state.search = e.target.value; renderList(); });
$('#new-msgs-btn').addEventListener('click', () => renderMsgs(true));
$('#role-select').addEventListener('change', e => {
  state.role = e.target.value;
  /* смена роли сбрасывает ВСЕ оверлеи: попап, модалку, режим заметки — иначе утечка прав */
  hideTplPop();
  closeModal();
  state.noteMode = false;
  state.tab = state.role === 'manager' ? 'mine' : 'all';   // ролевой дефолт вкладки (11 §2.1)
  toast('Роль: ' + ROLE_TITLES[state.role] + ' — интерфейс перестроен по матрице прав');
  renderAll();
});
$('#theme-toggle').addEventListener('click', () => {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  $('#theme-toggle').textContent = dark ? '🌙' : '☀️';
});
document.addEventListener('click', e => {
  const demo = e.target.closest('[data-demo]');
  if (demo) { e.preventDefault(); toast(demo.dataset.demo); }
});
document.addEventListener('keydown', e => {
  /* Esc — «луковица»: по одному слою за нажатие (10 §5.1), в конце — очистка поиска (11 §8.4) */
  if (e.key === 'Escape') {
    if ($('#tpl-pop')) { hideTplPop(); return; }
    if ($('#ovl')) { closeModal(); return; }
    const cp = $('#card-pane');
    if (cp.classList.contains('overlay-open')) { cp.classList.remove('overlay-open'); return; }
    if (state.noteMode) {
      state.noteMode = false;
      renderFoot();
      const inp = $('#composer-input');
      if (inp) inp.focus();
      return;
    }
    if (state.search) { state.search = ''; $('#search').value = ''; renderList(); }
    return;
  }
  /* Ctrl+K — фокус в поиск (10 §5.1) */
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.code === 'KeyK') {
    e.preventDefault();
    $('#search').focus();
    return;
  }
  /* Ctrl+Shift+N — режим заметки */
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.code === 'KeyN') {
    if (can.send() && byId(state.currentId) && $('#composer-input')) {
      e.preventDefault();
      state.noteMode = !state.noteMode;
      renderFoot();
      $('#composer-input').focus();
    }
    return;
  }
  /* Alt+1..4 — вкладки Мои/Все/Новые/Закрытые */
  if (e.altKey && /^Digit[1-4]$/.test(e.code)) {
    e.preventDefault();
    state.tab = TABS[+e.code.slice(5) - 1].id;
    renderList();
    return;
  }
  /* J/K и ↓/↑ — навигация по списку, когда фокус вне полей ввода */
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'KeyJ' || e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); return; }
  if (e.code === 'KeyK' || e.key === 'ArrowUp')   { e.preventDefault(); moveSelection(-1); }
});

/* =================== Старт =================== */
byId(state.currentId).unread = 0;   // открытый диалог считается прочитанным
renderAll();
</script>
